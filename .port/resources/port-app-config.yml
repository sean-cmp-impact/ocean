resources:
  - kind: source
    selector:
      query: 'true'
    port:
      entity:
        mappings:
          identifier: .id
          title: '(.type + " - " + .full_name)'
          blueprint: '"gitguardianSource"'
          properties:
            id: .my_enum
            sourceType: .type
            fullName: .full_name
            url: .url
            health: .health
            sourceCriticality: .source_criticality
            openIncidentsCount: .open_incidents_count
            openIncidentsSeverityBreakdown:
              critical: .secret_incidents_breakdown.open_secret_incidents.severity_breakdown.critical
              high: .secret_incidents_breakdown.open_secret_incidents.severity_breakdown.high
              medium: .secret_incidents_breakdown.open_secret_incidents.severity_breakdown.medium
              low: .secret_incidents_breakdown.open_secret_incidents.severity_breakdown.low
              info: .secret_incidents_breakdown.open_secret_incidents.severity_breakdown.info
              unknown: .secret_incidents_breakdown.open_secret_incidents.severity_breakdown.unknown
            closedIncidentsCount: .closed_incidents_count
            closedIncidentsSeverityBreakdown:
              critical: .secret_incidents_breakdown.closed_secret_incidents.severity_breakdown.critical
              high: .secret_incidents_breakdown.closed_secret_incidents.severity_breakdown.high
              medium: .secret_incidents_breakdown.closed_secret_incidents.severity_breakdown.medium
              low: .secret_incidents_breakdown.closed_secret_incidents.severity_breakdown.low
              info: .secret_incidents_breakdown.closed_secret_incidents.severity_breakdown.info
              unknown: .secret_incidents_breakdown.closed_secret_incidents.severity_breakdown.unknown
            lastScan:
              date: .last_scan.date
              status: .last_scan.status
              failingReason: .last_scan.failing_reason
              commitScanned: .last_scan.commits_scanned
              duration: .last_scan.duration
              branchesScanned: .last_scan.branches_scanned
              progress: .last_scan.progress
            visibility: .visibility
  - kind: secret_detector
    selector:
      query: 'true'
    port:
      entity:
        mappings:
          identifier: .name
          title: .display_name
          blueprint: '"gitguardianSecretDetector"'
          properties:
            name: .name
            displayName: .display_name
            type: .type
            category: .category
            isActive: .is_active
            scansCodeOnly: .scans_code_only
            checkable: .checkable
            useWithValidityCheckDisabled: .use_with_validity_check_disabled
            frequency: .frequency
            removedAt: .removed_at
            openIncidentsCount: .open_incidents_count
            ignoredIncidentsCount: .ignored_incidents_count
            resolvedIncidentsCount: .resolved_incidents_count
  - kind: internal_secret_incident
    selector:
      query: 'true'
    port:
      entity:
        mappings:
          identifier: .id
          title: '(.id + ": " + .detector.name)'
          blueprint: '"gitguardianSecretIncident"'
          properties:
            id: .id
            exposure: "internal"
            date: .date
            detector:
              name: .detector.name
              displayName: .detector.display_name
              nature: .detector.nature
              family: .detector.family
              detectorGroupName: .detector.detector_group_name
              detectorGroupDisplayName: .detector.detector_group_display_name
            secretId: .secret_id
            gitguardianUrl: .gitguardian_url
            regression: .regression
            status: .status
            occurrencesCount: .occurrences_count
            ignoreReason: .ignore_reason
            ignoredAt: .ignored_at
            secretRevoked: .secret_revoked
            severity: .severity
            validity: .validity
            resolvedAt: .resolved_at
            shareUrl: share_url
  - kind: public_secret_incident
    selector:
      query: 'true'
    port:
      entity:
        mappings:
          identifier: .id
          title: '(.id + ": " + .detector.name)'
          blueprint: '"gitguardianSecretIncident"'
          properties:
            id: .id
            exposure: "public"
            date: .date
            detector:
              name: .detector.name
              displayName: .detector.display_name
              nature: .detector.nature
              family: .detector.family
              detectorGroupName: .detector.detector_group_name
              detectorGroupDisplayName: .detector.detector_group_display_name
            secretId: .secret_id
            gitguardianUrl: .gitguardian_url
            regression: .regression
            status: .status
            occurrencesCount: .occurrences_count
            ignoreReason: .ignore_reason
            ignoredAt: .ignored_at
            secretRevoked: .secret_revoked
            severity: .severity
            validity: .validity
            resolvedAt: .resolved_at
            shareUrl: share_url